name: Bug report
description: Something in Vanguard does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Claude Code version
      placeholder: "output of: claude --version"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Terminal
        - Desktop app
        - VS Code
        - Other
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or logs
      description: A screenshot of the pane, or lines from `claude --debug`.
