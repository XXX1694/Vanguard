name: Feature request
description: An idea for the pane, the orchestrator, an agent or a skill
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Vanguard makes hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like Vanguard to do?
